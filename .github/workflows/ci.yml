name: CI

# Runs on pull requests and manual dispatch only — never on push. Keeps the
# boundary/secret/test gates in front of every merge without reacting to every
# commit. No secrets are used; permissions are read-only and least-privilege.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: boundary + secret + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.18.4"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1   # current tree only; we scan the published tree, not history

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"

      - name: Public-boundary check
        run: python tools/pre_publish_check.py

      - name: Public-boundary checker tests
        run: python tools/test_pre_publish_check.py

      - name: Safe-by-default (census-only) guard
        run: python local-audit/test_local_audit.py

      - name: ctxcheck tests
        run: python ctxcheck/test_ctxcheck.py

      - name: ctxdex secret-gate tests
        run: python ctxdex/test_ctxdex_gate.py

      - name: slop_prepass self-test
        run: python local-audit/slop_prepass.py --self-test

      - name: graphify refresh failure-accounting tests
        # Drives graphify/Refresh-Graphs.ps1 under pwsh (preinstalled on ubuntu-latest).
        run: python graphify/test_refresh_graphs.py

      - name: graphify health-check boundary tests
        # Drives graphify/Check-GraphifyHealth.ps1 under pwsh; scheduled-task and PyPI calls are stubbed.
        run: python graphify/test_health_check.py

      - name: evidence-relevance tests
        run: python evidence-relevance/test_measure_relevance.py

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tar="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tar" "$base/$tar"
          curl -fsSL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tar\$" checksums.txt | sha256sum -c -
          tar -xzf "$tar" gitleaks
          ./gitleaks version

      - name: Gitleaks secret scan (published tree)
        # --no-git on a fresh checkout scans exactly the tracked tree (git-ignored
        # dirs are not present in CI), mirroring the local release-check gate.
        run: ./gitleaks detect --source . --no-git --config .gitleaks.toml --redact --no-banner

  graphify-winps51:
    # The scheduled tasks run Windows PowerShell 5.1, whose JSON and path APIs
    # differ from pwsh 7; the graphify suites run under it too.
    name: graphify tests (Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GRAPHIFY_TEST_SHELL: powershell.exe
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"

      - name: graphify refresh tests (5.1)
        run: python graphify/test_refresh_graphs.py

      - name: graphify health-check boundary tests (5.1)
        run: python graphify/test_health_check.py
