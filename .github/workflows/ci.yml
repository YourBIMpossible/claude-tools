name: CI

# Runs on pull requests and manual dispatch only — never on push. Keeps the
# boundary/secret/test gates in front of every merge without reacting to every
# commit. No secrets are used; permissions are read-only and least-privilege.
#
# Both jobs run the one gate, tools/gate.py: the public-boundary check, the
# machine-paths guard, the slop_prepass self-test, every test suite in its
# TEST_SUITES (with the one package a suite needs, evidence-compiler, installed
# at the commit gate.py pins) and the gitleaks secret scan. The pre-push hook (.githooks/pre-push)
# runs the same gate on the pushing machine, so a push that would fail here is
# blocked before it leaves. A new check goes into tools/gate.py, not into a step
# here. Linux leaves out the Windows-only suite; Windows runs the PowerShell
# suites under pwsh 7 and under Windows PowerShell 5.1 (the shell the scheduled
# tasks use, whose JSON and path APIs differ from pwsh 7).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.18.4"   # tools/gate.py GITLEAKS_PIN and bin/README.md pin the same version

jobs:
  gate-linux:
    name: gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1   # current tree only; we scan the published tree, not history

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Install gitleaks (pinned, checksum-verified)
        # Outside the checkout, so the tree the gate scans holds only tracked files.
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          cd "$dir"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tar="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tar" "$base/$tar"
          curl -fsSL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tar\$" checksums.txt | sha256sum -c -
          tar -xzf "$tar" gitleaks
          ./gitleaks version
          echo "GITLEAKS_BIN=$dir/gitleaks" >> "$GITHUB_ENV"

      - name: Install evidence-compiler (pinned)
        # evidence-episodes/test_build_episodes.py needs it; tools/gate.py EVIDENCE_COMPILER_PIN names the same commit.
        run: python -m pip install "git+https://github.com/YourBIMpossible/evidence-compiler@1cdc625c4c18ea95994eaf424b039b06e9387d6c"

      - name: Gate
        # pwsh is preinstalled on ubuntu-latest, so the PowerShell suites run here under pwsh 7.
        run: python tools/gate.py --verbose

  gate-windows:
    name: gate (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Install gitleaks (pinned, checksum-verified)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:GITLEAKS_VERSION
          $dir = Join-Path $env:RUNNER_TEMP 'gitleaks'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $base = "https://github.com/gitleaks/gitleaks/releases/download/v$v"
          $zip = "gitleaks_${v}_windows_x64.zip"
          $zipPath = Join-Path $dir $zip
          $sumPath = Join-Path $dir 'checksums.txt'
          Invoke-WebRequest -Uri "$base/$zip" -OutFile $zipPath
          Invoke-WebRequest -Uri "$base/gitleaks_${v}_checksums.txt" -OutFile $sumPath
          $line = Get-Content $sumPath | Where-Object { $_ -match (' ' + [regex]::Escape($zip) + '$') }
          if (-not $line) { throw "no checksum listed for $zip" }
          $want = ($line -split '\s+')[0].ToLowerInvariant()
          $got = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($got -ne $want) { throw "checksum mismatch for ${zip}: got $got, want $want" }
          Expand-Archive -Path $zipPath -DestinationPath $dir -Force
          $exe = Join-Path $dir 'gitleaks.exe'
          & $exe version
          "GITLEAKS_BIN=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install evidence-compiler (pinned)
        # evidence-episodes/test_build_episodes.py needs it; tools/gate.py EVIDENCE_COMPILER_PIN names the same commit.
        run: python -m pip install "git+https://github.com/YourBIMpossible/evidence-compiler@1cdc625c4c18ea95994eaf424b039b06e9387d6c"

      - name: Gate
        # Git for Windows runs the pre-push hook tests' hook under its own sh, the path the owner's machines take.
        run: python tools/gate.py --verbose
