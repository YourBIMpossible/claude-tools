name: secret-scan

# The one automatic remote check: the gitleaks secret scan and the public-boundary check (tools/pre_publish_check.py).
# This repo is public, so the boundary guard stays in front of every PR along with the secret scan. Everything else
# (every test suite, both operating systems) runs locally before every push through the pre-push hook
# (.githooks/pre-push runs tools/gate.py), and on demand through ci.yml.
#
# Cost posture (2026-11-02): ubuntu-latest, PR + manual only, non-draft, and cancel-in-progress, as the house
# secret-scan.yml. Both steps are the gate's own: the same boundary script, and gitleaks over the tracked tree with
# the repo's .gitleaks.toml, so the local and remote verdicts match by construction.
on:
  pull_request:
    # No `synchronize`: pushing more commits to an open PR does not re-fire this. The pre-push gate runs the same
    # two checks on each push; re-run remotely by hand (workflow_dispatch) or by flipping draft->ready when you want
    # the fresh confirmation.
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.18.4"   # tools/gate.py GITLEAKS_PIN and bin/README.md pin the same version

jobs:
  secret-scan:
    name: secret scan + public boundary
    # Skip drafts on PR events; always run on manual dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1   # current tree only; we scan the published tree, not history

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Public-boundary check
        run: python tools/pre_publish_check.py

      - name: Install gitleaks (pinned, checksum-verified)
        # Outside the checkout, so the tree scanned holds only tracked files.
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          cd "$dir"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tar="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tar" "$base/$tar"
          curl -fsSL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tar\$" checksums.txt | sha256sum -c -
          tar -xzf "$tar" gitleaks
          ./gitleaks version

      - name: gitleaks (tracked tree, the gate's scan)
        # tools/gate.py secret_scan: the tracked files copied out, scanned with --no-git and the repo's .gitleaks.toml.
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/tree"
          mkdir -p "$tree"
          git archive HEAD | tar -x -C "$tree"
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --source "$tree" --no-git --redact --no-banner --config .gitleaks.toml
