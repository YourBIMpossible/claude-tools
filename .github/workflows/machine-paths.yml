name: machine-paths

# Fails when a tracked file holds an absolute, machine-specific path (drive-letter,
# Git-Bash drive root, user home, UNC share). Self-contained and repo-agnostic: to adopt
# it in another repo, copy this file and .github/scripts/check_machine_paths.py, and
# add a .machine-paths-allow.json at the repo root only if something must be exempt.
# Run the same check locally:  python .github/scripts/check_machine_paths.py
#
# Cost posture (2026-11-02): ubuntu-latest, PR + manual only, non-draft, and
# cancel-in-progress, as the house secret-scan.yml.
on:
  pull_request:
    # No `synchronize`: pushing more commits to an open PR does not re-fire this. The pre-push
    # gate runs the same guard on each push; re-run remotely by hand (workflow_dispatch) or by
    # flipping draft->ready when you want the fresh confirmation.
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: machine-paths-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  machine-paths:
    name: no machine-specific paths
    # Skip drafts on PR events; always run on manual dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Guard self-test
        run: python .github/scripts/check_machine_paths.py --self-test

      - name: Scan tracked files
        run: python .github/scripts/check_machine_paths.py
