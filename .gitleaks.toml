# gitleaks config for Claude-Tools.
# Extends the default ruleset; adds a scoped allowlist for intentional test
# fixtures. Run: bin/gitleaks.exe detect --source .
[extend]
useDefault = true

[allowlist]
description = "Synthetic secret vectors in ctxdex's secret-gate test suite. These are deliberate fakes (AWS's public docs example key, placeholder PEM, dummy connection strings) used to verify ctxdex refuses to index credentials — not real secrets."
paths = [
  '''ctxdex/test_ctxdex_gate\.py''',
]
