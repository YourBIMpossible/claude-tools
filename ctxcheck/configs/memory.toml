# ctxcheck config: Claude auto-memory directory (memory-lint)
# The index's markdown links are declared claims -> broken ones FAIL.
# [[wikilinks]] may legitimately point at not-yet-written memories -> WARN.
# Staleness only WARNs (120d): old memories need review, not deletion.
# Not a git repo, so staleness falls back to file mtime by design.
# Do NOT suppress wikilink warnings to make the baseline green: a forward-link
# warn clears only when the target memory is written or the link is removed.
repo = "C:/Users/Zeria/.claude/projects/F--BIMpossible/memory"

[files]
require = ["MEMORY.md"]

[refs]
scan_strict = ["MEMORY.md"]
wikilinks = ["*.md"]

[staleness]
paths = ["*.md"]
max_age_days = 120
